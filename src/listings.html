<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Listings – Performr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="explore-layout">

  <header>
    <div class="right">
      <span class="logo">performr</span>
      <a href="profile.html" class="logo-dot"></a>
    </div>
  </header>

  <div class="tab-bar">
    <a href="explore.html"   class="tab-explore">Explore</a>
    <a href="applied.html"   class="tab-applied">Applied</a>
    <a href="listings.html"  class="tab-listings">My Listings</a>
  </div>


    <main class="page">
    <div class="section-header">
      <h1>My Listings</h1>
      <button class="btn-create">Create a new role +</button>
    </div>
    <div class="roles-grid" id="roles-grid">
      <p>Loading...</p>

    </div>
  </main>

  <!-- Create Role Modal -->
  <div id="createRoleModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center;">
    <div style="background:#fff; border-radius:12px; padding:2rem; width:90%; max-width:480px; display:flex; flex-direction:column; gap:1rem;">
      <h2 style="margin:0;">Create a New Role</h2>

      <input id="roleName"     placeholder="Role name *"               style="padding:.6rem; border:1px solid #ddd; border-radius:6px;" />
      <input id="roleGenre"    placeholder="Genre (e.g. Jazz, Hip-hop)" style="padding:.6rem; border:1px solid #ddd; border-radius:6px;" />
      <input id="roleLevel"    placeholder="Level (e.g. Beginner, Pro)" style="padding:.6rem; border:1px solid #ddd; border-radius:6px;" />
      <input id="roleAddr"     placeholder="Address"                   style="padding:.6rem; border:1px solid #ddd; border-radius:6px;" />
      <input id="roleCity"     placeholder="City"                      style="padding:.6rem; border:1px solid #ddd; border-radius:6px;" />
      <input id="roleLocation" placeholder="Location description"      style="padding:.6rem; border:1px solid #ddd; border-radius:6px;" />
      <input id="roleUniform"  placeholder="Uniform requirements"      style="padding:.6rem; border:1px solid #ddd; border-radius:6px;" />

      <div style="display:flex; gap:.75rem; justify-content:flex-end;">
        <button onclick="closeModal()"  style="padding:.6rem 1.2rem; border:1px solid #ddd; border-radius:6px; cursor:pointer; background:#fff;">Cancel</button>
        <button onclick="submitRole()"  style="padding:.6rem 1.2rem; border:none; border-radius:6px; cursor:pointer; background:#000; color:#fff;">Submit</button>
      </div>
      <p id="modalError" style="color:red; margin:0; display:none;"></p>
    </div>
  </div>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<script>
  (async () => {
    if (!await initApp()) return;

    document.querySelector('.btn-create').addEventListener('click', () => {
      window.location.href = 'addList.html';
    });

    const { data, error } = await window.db
      .from('roles')
      .select('*')
      .eq('created_by', window.currentUser.sub);

    const grid = document.getElementById('roles-grid');
    grid.innerHTML = '';

    if (error) {
      console.error('Supabase error:', error.message, error.hint);
      grid.innerHTML = '<p>Failed to load listings.</p>';
      return;
    }

    if (!data || data.length === 0) {
      grid.innerHTML = '<p>No listings yet. Create one above!</p>';
      return;
    }

    data.forEach(role => {
      const card = document.createElement('div');
      card.className = 'role-card';
      card.innerHTML = `
        <h2>${role.name}</h2>
        <p class="card-address">${role.addr ? role.addr + ', ' : ''}${role.city}</p>
        <div class="card-tags">
          <span class="tag-pill">${role.genre}</span>
          <span class="tag-pill">${role.level}</span>
          <span class="tag-pill">${role.location}</span>
          <span class="tag-pill">${role.uniform}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  })();

  function openModal() {
    document.getElementById('createRoleModal').style.display = 'flex';
  }

  function closeModal() {
    document.getElementById('createRoleModal').style.display = 'none';
    document.getElementById('modalError').style.display = 'none';
  }

  async function submitRole() {
    const name = document.getElementById('roleName').value.trim();
    if (!name) {
      const err = document.getElementById('modalError');
      err.textContent = 'Role name is required.';
      err.style.display = 'block';
      return;
    }

    const token = await window.client.getTokenSilently();

    const payload = {
      name,
      genre:      document.getElementById('roleGenre').value.trim(),
      level:      document.getElementById('roleLevel').value.trim(),
      addr:       document.getElementById('roleAddr').value.trim(),
      city:       document.getElementById('roleCity').value.trim(),
      location:   document.getElementById('roleLocation').value.trim(),
      uniform:    document.getElementById('roleUniform').value.trim(),
      created_by: window.currentUser.sub,
    };

    const res = await fetch('https://golijzcjitljymhpjaur.supabase.co/rest/v1/roles', {
      method: 'POST',
      headers: {
        'apikey':        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvbGlqemNqaXRsanltaHBqYXVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDYxMDQsImV4cCI6MjA5NTEyMjEwNH0.fRLEv-8VrrrdnN6Ds9iux4PuDfHcLS3x2ezodp4w_Bk',
        'Authorization': `Bearer ${token}`,
        'Content-Type':  'application/json',
        'Prefer':        'return=representation',
      },
      body: JSON.stringify(payload),
    });

    if (res.ok) {
      closeModal();
      ['roleName','roleGenre','roleLevel','roleAddr','roleCity','roleLocation','roleUniform']
        .forEach(id => document.getElementById(id).value = '');
      location.reload();
    } else {
      const errData = await res.json();
      const err = document.getElementById('modalError');
      err.textContent = 'Error: ' + (errData.message ?? JSON.stringify(errData));
      err.style.display = 'block';
    }
  }
</script>

</body>
</html>
