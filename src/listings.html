<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Listings – Performr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-layout">

  <header>
    <img src="assets/performr.png" alt="Performr logo" class="logo" />
    <a href="profile.html"></a>
  </header>

  <nav>
    <a href="explore.html">Explore</a>
    <a href="applied.html">Applied</a>
    <a href="listings.html">My Listings</a>
  </nav>

  <main>
<div class="page-header">
  <h1>My Listings</h1>
<button class="create" onclick="document.getElementById('modal').showModal()">Create a new role +</button>    </div>
    


    <ul class="roles" id="roles-list">
      <li>Loading…</li>
    </ul>
  </main>

<dialog id="modal">
  <form method="dialog">
    <section>
      <div class="page-header">
        <h2>New role</h2>
        <button type="submit" style="background:none; border:none; font-size:20px; cursor:pointer; color:#460000;">×</button>
      </div>
      <label>Role name <input id="roleName" type="text" placeholder="e.g. Lead Tap Dancer" required /></label>
      <label>Genre <input id="roleGenre" type="text" placeholder="e.g. Jazz, Hip-hop" /></label>
      <label>Level <input id="roleLevel" type="text" placeholder="e.g. Beginner, Pro" /></label>
      <label>Address <input id="roleAddr" type="text" placeholder="123 Main St" /></label>
      <label>City <input id="roleCity" type="text" placeholder="Montreal" /></label>
      <label>Location <input id="roleLocation" type="text" placeholder="Indoor studio, venue…" /></label>
      <label>Uniform <input id="roleUniform" type="text" placeholder="e.g. Black attire, none" /></label>
      <p class="error" id="modalError" hidden></p>
    </section>
    <section>
      <button class="submit" type="button" onclick="submitRole()">Publish Role →</button>
    </section>
  </form>
</dialog>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async () => {
      const { createClient } = supabase;
      window.db = createClient(
        'https://golijzcjitljymhpjaur.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvbGlqemNqaXRsanltaHBqYXVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDYxMDQsImV4cCI6MjA5NTEyMjEwNH0.fRLEv-8VrrrdnN6Ds9iux4PuDfHcLS3x2ezodp4w_Bk'
      );
      window.client = await auth0.createAuth0Client({
        domain: 'dev-wdfb7tfjkndmtcl5.us.auth0.com',
        clientId: 'Ix662hc4PCymFOpQeFK4OvMKWzAjF3Cn',
        authorizationParams: { redirect_uri: location.origin, audience: 'https://performr.api',
        },
        cacheLocation: 'localstorage',
        useRefreshTokens: true,
      });
 
      if (!(await window.client.isAuthenticated())) {
        window.location.href = 'index.html';
        return;
      }
 
      const user = await window.client.getUser();
      window.currentUser = user;
      const token = await window.client.getTokenSilently();
      window.db.functions.setAuth(token);

      // Wire up button immediately after auth — not dependent on data loading
      document.querySelector('.btn-create').addEventListener('click', () => {
        window.location.href = 'addList.html';
      });

      const { data, error } = await window.db
        .from('roles')
        .select('*')
        .eq('created_by', window.currentUser.sub);

      const list = document.getElementById('roles-list');
      list.innerHTML = '';

      if (error) { list.innerHTML = '<li>Failed to load listings.</li>'; return; }
      if (!data?.length) { list.innerHTML = '<li>No listings yet. Create one above!</li>'; return; }

      data.forEach(role => {
        const li = document.createElement('li');
        li.innerHTML = `
          <h2>${role.name}</h2>
          <p>${role.addr ? role.addr + ', ' : ''}${role.city ?? ''}</p>
          <footer>
            ${[role.genre, role.level, role.location, role.uniform].filter(Boolean).map(t => `<span>${t}</span>`).join('')}
          </footer>
        `;
        list.appendChild(li);
      });
    })();

    async function submitRole() {
      const errEl = document.getElementById('modalError');
      errEl.hidden = true;

      const name = document.getElementById('roleName').value.trim();
      if (!name) { errEl.textContent = 'Role name is required.'; errEl.hidden = false; return; }

      const btn = document.querySelector('dialog button.submit');
      btn.disabled = true;
      btn.textContent = 'Publishing…';

      try {
        const token = await window.client.getTokenSilently();
        const res = await fetch('https://golijzcjitljymhpjaur.supabase.co/rest/v1/roles', {
          method: 'POST',
          headers: {
            'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvbGlqemNqaXRsanltaHBqYXVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDYxMDQsImV4cCI6MjA5NTEyMjEwNH0.fRLEv-8VrrrdnN6Ds9iux4PuDfHcLS3x2ezodp4w_Bk',
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation',
          },
          body: JSON.stringify({
            name,
            genre:      document.getElementById('roleGenre').value.trim() || null,
            level:      document.getElementById('roleLevel').value.trim() || null,
            addr:       document.getElementById('roleAddr').value.trim() || null,
            city:       document.getElementById('roleCity').value.trim() || null,
            location:   document.getElementById('roleLocation').value.trim() || null,
            uniform:    document.getElementById('roleUniform').value.trim() || null,
            created_by: window.currentUser.sub,
          }),
        });

        if (res.ok) { location.reload(); }
        else {
          const err = await res.json();
          throw new Error(err.message ?? JSON.stringify(err));
        }
      } catch (e) {
        errEl.textContent = 'Error: ' + e.message;
        errEl.hidden = false;
        btn.disabled = false;
        btn.textContent = 'Publish Role →';
      }
    }
  </script>
</body>
</html>
