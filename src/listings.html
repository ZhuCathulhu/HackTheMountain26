  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (async () => {
      const { createClient } = supabase;
      window.db = createClient(
        'https://golijzcjitljymhpjaur.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvbGlqemNqaXRsanltaHBqYXVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDYxMDQsImV4cCI6MjA5NTEyMjEwNH0.fRLEv-8VrrrdnN6Ds9iux4PuDfHcLS3x2ezodp4w_Bk'
      );
      window.client = await auth0.createAuth0Client({
        domain: 'dev-wdfb7tfjkndmtcl5.us.auth0.com',
        clientId: 'Ix662hc4PCymFOpQeFK4OvMKWzAjF3Cn',
        authorizationParams: { redirect_uri: location.origin },
      });
 
      if (!(await window.client.isAuthenticated())) {
        window.location.href = 'index.html';
        return;
      }
 
      const user = await window.client.getUser();
      window.currentUser = user;
      const token = await window.client.getTokenSilently();
      window.db.functions.setAuth(token);

      const { data, error } = await window.db
        .from('roles')
        .select('*')
        .eq('created_by', user.sub);
 
      const grid = document.getElementById('roles-grid');
      grid.innerHTML = '';
 
      if (error) {
        console.error('Supabase error:', error.message, error.hint);
        grid.innerHTML = '<p>Failed to load listings.</p>';
        return;
      }
 
      if (!data || data.length === 0) {
        grid.innerHTML = '<p>No listings yet. Create one above!</p>';
        return;
      }
 
      data.forEach(role => {
        const card = document.createElement('div');
        card.className = 'role-card';
        card.innerHTML = `
          <h2>${role.name}</h2>
          <p class="card-address">${role.addr ? role.addr + ', ' : ''}${role.city}</p>
          <div class="card-tags">
            <span class="tag-pill">${role.genre}</span>
            <span class="tag-pill">${role.level}</span>
            <span class="tag-pill">${role.location}</span>
            <span class="tag-pill">${role.uniform}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    })();
  </script>
