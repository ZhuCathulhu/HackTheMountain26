<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Listings – Performr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <header>
    <div class="right">
      <span class="logo">performr</span>
      <div class="logo-dot"></div>
    </div>
  </header>

  <div class="tab-bar">
    <a href="explore.html"   class="tab-explore">Explore</a>
    <a href="applied.html"   class="tab-applied">Applied</a>
    <a href="listings.html"  class="tab-listings">My Listings</a>
  </div>

  <main class="page">
    <div class="section-header">
      <h1>My Listings</h1>
      <button class="btn-create">Create a new role +</button>
    </div>

    <div class="roles-grid">

      <!-- Populated card -->
      <div class="role-card">
        <h2>Tap Dancer</h2>
        <p class="card-address">123 ave Green</p>
        <div class="card-tags">
          <span class="tag-pill">Pianist</span>
          <span class="tag-pill">Intermediate</span>
        </div>
        <p class="card-desc">
          Lorem Ipsum is simply dummy text of the printing and typesetting industry.
          Lorem Ipsum has been the industry's standard dummy text ever since the 1500s,
          when an unknown printer took a galley of type.
        </p>
      </div>

      <!-- Empty cards -->
      <div class="role-card empty"></div>
      <div class="role-card empty"></div>
      <div class="role-card empty"></div>
      <div class="role-card empty"></div>
      <div class="role-card empty"></div>

    </div>
  </main>
</body>
</html>
