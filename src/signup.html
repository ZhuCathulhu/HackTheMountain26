<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Your Profile – Performr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --dark: #1A0A0A;
      --muted: #888;
      --border: #e8e8e4;
      --bg: #f7f7f5;
      --font: 'DM Sans', sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); min-height: 100vh; color: var(--dark); }

    header {
      display: flex; align-items: center; justify-content: flex-end;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: #fff;
    }
    .right { display: flex; align-items: center; gap: .4rem; }
    .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: -.02em; }
    .logo-dot { width: 6px; height: 6px; border-radius: 50%; background: #000; }

    .signup-wrap { max-width: 560px; margin: 2.5rem auto 5rem; padding: 0 1.25rem; }

    .page-heading { margin-bottom: 2rem; }
    .page-heading h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -.04em; margin-bottom: .35rem; }
    .page-heading p { font-size: .9rem; color: var(--muted); }

    .form-card { background: #fff; border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }

    .form-section { padding: 1.5rem; border-bottom: 1px solid #f0f0ec; }
    .form-section:last-of-type { border-bottom: none; }

    .section-label {
      font-size: .7rem; font-weight: 600; letter-spacing: .1em;
      text-transform: uppercase; color: #aaa; margin-bottom: 1rem;
    }

    .field { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: .8rem; font-weight: 600; color: #555; }
    .field label .opt { color: #aaa; font-weight: 400; }

    .field input, .field textarea {
      font-family: var(--font); font-size: .9rem; padding: .65rem .85rem;
      border: 1.5px solid #e4e4e0; border-radius: 8px; background: #fafafa;
      color: #111; outline: none; transition: border-color .15s, background .15s; width: 100%;
    }
    .field input:focus, .field textarea:focus { border-color: #111; background: #fff; }
    .field input::placeholder, .field textarea::placeholder { color: #bbb; }
    .field textarea { resize: vertical; min-height: 90px; }

    .disc-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
    .disc-pill {
      display: flex; flex-direction: column; align-items: center; gap: .4rem;
      padding: .85rem .5rem; border-radius: 10px; border: 1.5px solid #e4e4e0;
      background: #fafafa; cursor: pointer; transition: all .15s; user-select: none; text-align: center;
    }
    .disc-pill .icon { font-size: 1.4rem; }
    .disc-pill .label { font-size: .78rem; font-weight: 600; color: #555; }
    .disc-pill.selected { background: var(--dark); border-color: var(--dark); }
    .disc-pill.selected .label { color: #fff; }

    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: .75rem 0; }
    .toggle-label { font-size: .85rem; font-weight: 600; color: #333; }
    .toggle-sub { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
    .toggle { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; inset: 0; background: #ddd;
      border-radius: 999px; cursor: pointer; transition: background .2s;
    }
    .toggle-slider::before {
      content: ''; position: absolute; width: 18px; height: 18px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform .2s;
    }
    .toggle input:checked + .toggle-slider { background: var(--dark); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

    .form-footer { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: .75rem; }

    #errorMsg { font-size: .85rem; color: #c0392b; display: none; }

    .btn-submit {
      width: 100%; padding: .85rem; background: var(--dark); color: #fff;
      border: none; border-radius: 10px; font-family: var(--font); font-size: .95rem;
      font-weight: 600; cursor: pointer; letter-spacing: -.01em; transition: background .15s, opacity .15s;
    }
    .btn-submit:hover { background: #3a1a1a; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }

    #disciplineDetailField { display: none; }
    #orgNameField { display: none; margin-top: .75rem; }
    .role-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
    .role-pill {
      display: flex; flex-direction: column; align-items: center; gap: .4rem;
      padding: .85rem .5rem; border-radius: 10px; border: 1.5px solid #e4e4e0;
      background: #fafafa; cursor: pointer; transition: all .15s; user-select: none; text-align: center;
    }
    .role-pill .icon { font-size: 1.4rem; }
    .role-pill .label { font-size: .78rem; font-weight: 600; color: #555; }
    .role-pill.selected { background: var(--dark); border-color: var(--dark); }
    .role-pill.selected .label { color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="right">
      <span class="logo">performr</span>
      <div class="logo-dot"></div>
    </div>
  </header>

  <div class="signup-wrap">
    <!-- CHANGED: Heading updated — Auth0 already handled the account creation,
         so this page is only about completing the Performr profile -->
    <div class="page-heading">
      <h1>Complete your profile</h1>
      <p>Just a few details so the community knows who you are.</p>
    </div>

    <div class="form-card">

      <!-- PROFILE -->
      <div class="form-section">
        <div class="section-label">Profile</div>
        <div class="field">
          <label for="displayName">Display Name <span style="color:#c00">*</span></label>
          <input id="displayName" type="text" placeholder="How you'll appear to others" />
        </div>
        <div class="field">
          <label for="location">Location <span class="opt">(optional)</span></label>
          <input id="location" type="text" placeholder="e.g. Montreal, QC" />
        </div>
        <div class="field">
          <label for="bio">Bio <span class="opt">(optional)</span></label>
          <textarea id="bio" placeholder="Tell the community a bit about yourself…"></textarea>
        </div>
        <div class="field">
          <label for="portfolioUrl">Portfolio URL <span class="opt">(optional)</span></label>
          <input id="portfolioUrl" type="url" placeholder="https://yoursite.com" />
        </div>
      </div>

      <!-- DISCIPLINE -->
      <div class="form-section">
        <div class="section-label">Discipline</div>
        <div class="field">
          <label>What best describes you? <span class="opt">(optional)</span></label>
          <div class="disc-group">
            <div class="disc-pill" data-value="performance">
              <span class="icon">🎭</span><span class="label">Performance</span>
            </div>
            <div class="disc-pill" data-value="visual">
              <span class="icon">🎨</span><span class="label">Visual</span>
            </div>
            <div class="disc-pill" data-value="audio">
              <span class="icon">🎵</span><span class="label">Audio</span>
            </div>
          </div>
        </div>
        <div class="field" id="disciplineDetailField">
          <label for="disciplineDetail">Tell us more <span class="opt">(optional)</span></label>
          <input id="disciplineDetail" type="text" placeholder="e.g. Contemporary dancer, Jazz pianist…" />
        </div>
      </div>

      <!-- ACCOUNT TYPE -->
      <div class="form-section">
        <div class="section-label">Account Type</div>
        <div class="toggle-row">
          <div>
            <div class="toggle-label">Organisation account</div>
            <div class="toggle-sub">Turn on if you're posting roles on behalf of a group or company</div>
          </div>
          <label class="toggle">
            <input type="checkbox" id="orgToggle" />
            <span class="toggle-slider"></span>
          </label>
        </div>
        <div class="field" id="orgNameField">
          <label for="orgName">Organisation Name <span style="color:#c00">*</span></label>
          <input id="orgName" type="text" placeholder="e.g. Montreal Dance Collective" />
        </div>
      </div>

      <!-- SUBMIT -->
      <div class="form-footer">
        <p id="errorMsg"></p>
        <button class="btn-submit" id="submitBtn" onclick="submitProfile()">Save & Enter Performr →</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let auth0Client = null;
    let selectedDiscipline = null;

    // This page is shown BEFORE the user has an Auth0 account.
    // We collect profile info, stash it in localStorage, then send them to Auth0 to create their account.
    // index.html picks it up after the Auth0 callback and saves it to Supabase.
    (async () => {
      auth0Client = await auth0.createAuth0Client({
        domain: 'dev-wdfb7tfjkndmtcl5.us.auth0.com',
        clientId: 'Ix662hc4PCymFOpQeFK4OvMKWzAjF3Cn',
        authorizationParams: {
          redirect_uri: location.origin,
          audience: 'https://performr.api',
        },
        cacheLocation: 'localstorage',
        useRefreshTokens: true,
      });

      // If they already have a session, skip straight to the app
      if (await auth0Client.isAuthenticated()) {
        window.location.href = 'explore.html';
      }
    })();

    // Discipline pills
    document.querySelectorAll('.disc-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.disc-pill').forEach(p => p.classList.remove('selected'));
        pill.classList.add('selected');
        selectedDiscipline = pill.dataset.value;
        document.getElementById('disciplineDetailField').style.display = 'flex';
      });
    });

    // Org toggle
    document.getElementById('orgToggle').addEventListener('change', function () {
      document.getElementById('orgNameField').style.display = this.checked ? 'flex' : 'none';
    });

    async function submitProfile() {
      const btn   = document.getElementById('submitBtn');
      const errEl = document.getElementById('errorMsg');
      errEl.style.display = 'none';

      const displayName = document.getElementById('displayName').value.trim();
      const isOrg       = document.getElementById('orgToggle').checked;
      const orgName     = document.getElementById('orgName')?.value.trim();

      if (!displayName) {
        errEl.textContent = 'Display name is required.';
        errEl.style.display = 'block';
        return;
      }
      if (isOrg && !orgName) {
        errEl.textContent = 'Please enter your organisation name.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Saving…';

      try {
        // Save profile data to localStorage — id and email are unknown until Auth0 creates the account.
        // index.html will read this after the Auth0 callback and write the row to Supabase.
        const profile = {
          org_user:          (selectedRole === 'organizer' || selectedRole === 'both') ? (orgName || null) : null,
          display_name:      displayName,
          discipline:        selectedDiscipline || null,
          discipline_detail: document.getElementById('disciplineDetail').value.trim() || null,
          bio:               document.getElementById('bio').value.trim() || null,
          location:          document.getElementById('location').value.trim() || null,
          portfolio_url:     document.getElementById('portfolioUrl').value.trim() || null,
        };

        localStorage.setItem('performr_pending_profile', JSON.stringify(profile));

        // Redirect to Auth0 signup — index.html is the callback URL
        await auth0Client.loginWithRedirect({
          authorizationParams: { screen_hint: 'signup' },
        });

      } catch (e) {
        errEl.textContent = 'Error: ' + e.message;
        errEl.style.display = 'block';
        btn.disabled    = false;
        btn.textContent = 'Save & Enter Performr →';
      }
    }
  </script>
</body>
</html>
