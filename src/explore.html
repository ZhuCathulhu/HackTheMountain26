<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore – Performr</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="explore">

<header>
  <img src="assets/performr.png" alt="Performr logo" class="logo" />
  <a href="profile.html"></a>
</header>

<nav>
  <a href="explore.html" class="active">Explore</a>
  <a href="applied.html">Applied</a>
  <a href="listings.html">My Listings</a>
</nav>

<main>

  <aside>
    <div>
      <input type="search" placeholder="Search by name or city…" aria-label="Search roles" />
      <button id="filter-btn" aria-expanded="false" aria-controls="filters">Filters <span></span></button>
    </div>

    <section id="filters" aria-label="Filters">
      <fieldset>
        <legend>Genre</legend>
        <button class="chip on" data-filter="genre" data-val="dance">Dance</button>
        <button class="chip on" data-filter="genre" data-val="instrumental">Instrumental</button>
        <button class="chip on" data-filter="genre" data-val="theatre">Theatre</button>
      </fieldset>
      <fieldset>
        <legend>Level</legend>
        <button class="chip on" data-filter="level" data-val="no experience">No experience</button>
        <button class="chip on" data-filter="level" data-val="beginner">Beginner</button>
        <button class="chip on" data-filter="level" data-val="novice">Novice</button>
        <button class="chip on" data-filter="level" data-val="intermediate">Intermediate</button>
        <button class="chip on" data-filter="level" data-val="pro">Pro</button>
      </fieldset>
      <fieldset>
        <legend>Location</legend>
        <button class="chip on" data-filter="location" data-val="indoors">Indoors</button>
        <button class="chip on" data-filter="location" data-val="outdoors">Outdoors</button>
        <button class="chip on" data-filter="location" data-val="venue">Venue</button>
      </fieldset>
      <fieldset>
        <legend>Uniform</legend>
        <button class="chip on" data-filter="uniform" data-val="no uniform">No uniform</button>
        <button class="chip on" data-filter="uniform" data-val="uniform provided">Uniform provided</button>
        <button class="chip on" data-filter="uniform" data-val="uniform required">Uniform required</button>
      </fieldset>
      <button id="clear-filters">Clear all filters</button>
    </section>

    <ul aria-label="Role list" aria-live="polite"></ul>
    <p hidden>No roles match your filters.</p>
  </aside>

  <div id="map" aria-label="Role locations map"></div>
  <p id="hint" role="status">📍 Pin added! Click it to see details.</p>

</main>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
<script src="auth.js"></script>
<script src="explore.js"></script>
</body>
</html>
