<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create a Role – Performr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f7f7f5;
      min-height: 100vh;
    }

    /* ── reuse your header/tab styles ── */
    header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #e8e8e4;
      background: #fff;
    }
    .right { display: flex; align-items: center; gap: .4rem; }
    .logo { font-size: 1.1rem; font-weight: 700; letter-spacing: -.02em; }
    .logo-dot { width: 6px; height: 6px; border-radius: 50%; background: #000; }

    .tab-bar {
      display: flex;
      border-bottom: 1px solid #e8e8e4;
      background: #fff;
    }
    .tab-bar a {
      padding: .75rem 1.25rem;
      font-size: .875rem;
      font-weight: 500;
      color: #888;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s;
    }
    .tab-bar a:hover { color: #000; }
    .tab-bar .tab-listings { color: #000; border-bottom-color: #000; }

    /* ── page layout ── */
    .add-page {
      max-width: 600px;
      margin: 2.5rem auto;
      padding: 0 1.25rem 4rem;
    }

    .page-heading {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 1.5px solid #ddd;
      background: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      text-decoration: none;
      color: #000;
      transition: background .15s, border-color .15s;
    }
    .back-btn:hover { background: #f0f0f0; }

    .page-heading h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -.03em;
    }

    /* ── form card ── */
    .form-card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e8e8e4;
      overflow: hidden;
    }

    .form-section {
      padding: 1.5rem;
      border-bottom: 1px solid #f0f0ec;
    }
    .form-section:last-of-type { border-bottom: none; }

    .section-label {
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 1rem;
    }

    .field { display: flex; flex-direction: column; gap: .4rem; margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }

    .field label {
      font-size: .8rem;
      font-weight: 600;
      color: #555;
    }

    .field input,
    .field select,
    .field textarea {
      font-family: 'DM Sans', sans-serif;
      font-size: .9rem;
      padding: .65rem .85rem;
      border: 1.5px solid #e4e4e0;
      border-radius: 8px;
      background: #fafafa;
      color: #111;
      outline: none;
      transition: border-color .15s, background .15s;
      appearance: none;
      -webkit-appearance: none;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #111;
      background: #fff;
    }
    .field input::placeholder,
    .field textarea::placeholder { color: #bbb; }

    .field textarea { resize: vertical; min-height: 80px; }

    /* custom select wrapper */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: .85rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #888;
      font-size: .8rem;
    }
    .select-wrap select { width: 100%; padding-right: 2rem; cursor: pointer; }

    /* two-column row */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

    /* tag pills for custom multi-select feel */
    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .pill {
      padding: .35rem .85rem;
      border-radius: 999px;
      border: 1.5px solid #e4e4e0;
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      background: #fafafa;
      color: #555;
      transition: all .15s;
      user-select: none;
    }
    .pill.selected {
      background: #111;
      border-color: #111;
      color: #fff;
    }

    /* submit area */
    .form-footer {
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    #errorMsg {
      font-size: .85rem;
      color: #c0392b;
      display: none;
    }

    .btn-submit {
      width: 100%;
      padding: .85rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -.01em;
      transition: background .15s, opacity .15s;
    }
    .btn-submit:hover { background: #333; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="right">
      <span class="logo">performr</span>
      <div class="logo-dot"></div>
    </div>
  </header>

  <div class="tab-bar">
    <a href="explore.html"  class="tab-explore">Explore</a>
    <a href="applied.html"  class="tab-applied">Applied</a>
    <a href="listings.html" class="tab-listings">My Listings</a>
  </div>

  <div class="add-page">
    <div class="page-heading">
      <a href="listings.html" class="back-btn">&#8592;</a>
      <h1>Create a Role</h1>
    </div>

    <div class="form-card">

      <!-- BASICS -->
      <div class="form-section">
        <div class="section-label">Basics</div>
        <div class="field">
          <label for="roleName">Role Name <span style="color:#c00">*</span></label>
          <input id="roleName" type="text" placeholder="e.g. Lead Tap Dancer" />
        </div>

        <div class="field">
          <label>Genre</label>
          <div class="select-wrap">
            <select id="roleGenre">
              <option value="">Select a genre…</option>
              <option>Jazz</option>
              <option>Hip-Hop</option>
              <option>Ballet</option>
              <option>Contemporary</option>
              <option>Latin</option>
              <option>Tap</option>
              <option>Musical Theatre</option>
              <option>Pop</option>
              <option>R&B</option>
              <option>Folk</option>
              <option>Classical</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="field" id="genreOtherField" style="display:none;">
          <label for="genreOther">Specify Genre</label>
          <input id="genreOther" type="text" placeholder="Enter genre…" />
        </div>

        <div class="field">
          <label>Level</label>
          <div class="select-wrap">
            <select id="roleLevel">
              <option value="">Select a level…</option>
              <option>Beginner</option>
              <option>Intermediate</option>
              <option>Advanced</option>
              <option>Professional</option>
              <option>Any Level</option>
            </select>
          </div>
        </div>
      </div>

      <!-- LOCATION -->
      <div class="form-section">
        <div class="section-label">Location</div>
        <div class="field">
          <label for="roleAddr">Address</label>
          <input id="roleAddr" type="text" placeholder="123 Main St" />
        </div>
        <div class="field-row">
          <div class="field">
            <label for="roleCity">City</label>
            <input id="roleCity" type="text" placeholder="Montreal" />
          </div>
          <div class="field">
            <label>Location Type</label>
            <div class="select-wrap">
              <select id="roleLocation">
                <option value="">Select…</option>
                <option>Indoor Studio</option>
                <option>Outdoor Stage</option>
                <option>Theatre</option>
                <option>Club / Venue</option>
                <option>Street / Public</option>
                <option>Private Event</option>
                <option>Remote / Virtual</option>
                <option>TBD</option>
              </select>
            </div>
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="roleLat">Latitude <span style="color:#aaa;font-weight:400">(optional)</span></label>
            <input id="roleLat" type="number" step="any" placeholder="45.5017" />
          </div>
          <div class="field">
            <label for="roleLng">Longitude <span style="color:#aaa;font-weight:400">(optional)</span></label>
            <input id="roleLng" type="number" step="any" placeholder="-73.5673" />
          </div>
        </div>
      </div>

      <!-- DETAILS -->
      <div class="form-section">
        <div class="section-label">Details</div>
        <div class="field">
          <label>Uniform / Dress Code</label>
          <div class="pill-group" id="uniformPills">
            <span class="pill" data-value="Black attire">Black attire</span>
            <span class="pill" data-value="Costume provided">Costume provided</span>
            <span class="pill" data-value="Bring your own">Bring your own</span>
            <span class="pill" data-value="Casual">Casual</span>
            <span class="pill" data-value="Formal">Formal</span>
            <span class="pill" data-value="None">None</span>
          </div>
          <input id="uniformOther" type="text" placeholder="Or type a custom requirement…" style="margin-top:.6rem;" />
        </div>
      </div>

      <!-- SUBMIT -->
      <div class="form-footer">
        <p id="errorMsg"></p>
        <button class="btn-submit" id="submitBtn" onclick="submitRole()">Publish Role →</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://golijzcjitljymhpjaur.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvbGlqemNqaXRsanltaHBqYXVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDYxMDQsImV4cCI6MjA5NTEyMjEwNH0.fRLEv-8VrrrdnN6Ds9iux4PuDfHcLS3x2ezodp4w_Bk';

    let currentUser = null;
    let auth0Client = null;

    // ── Init Auth0 ──
    (async () => {
      auth0Client = await auth0.createAuth0Client({
        domain: 'dev-wdfb7tfjkndmtcl5.us.auth0.com',
        clientId: 'Ix662hc4PCymFOpQeFK4OvMKWzAjF3Cn',
        authorizationParams: {
          redirect_uri: location.origin,
          audience: 'https://performr.api',
        },
        cacheLocation: 'localstorage',
        useRefreshTokens: true,
      });

      if (!(await auth0Client.isAuthenticated())) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = await auth0Client.getUser();
    })();

    // ── Genre "Other" toggle ──
    document.getElementById('roleGenre').addEventListener('change', function () {
      document.getElementById('genreOtherField').style.display =
        this.value === 'Other' ? 'flex' : 'none';
    });

    // ── Uniform pill toggle ──
    document.querySelectorAll('#uniformPills .pill').forEach(pill => {
      pill.addEventListener('click', () => {
        pill.classList.toggle('selected');
        document.getElementById('uniformOther').value = '';
      });
    });
  })();

  // ── Submit ──
  async function submitRole() {
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    const name = document.getElementById('roleName').value.trim();
    if (!name) {
      errEl.textContent = 'Role name is required.';
      errEl.style.display = 'block';
      return;
    }

    const genreSelect = document.getElementById('roleGenre').value;
    const genre = genreSelect === 'Other'
      ? document.getElementById('genreOther').value.trim()
      : genreSelect;

    const selectedPills = [...document.querySelectorAll('#uniformPills .pill.selected')]
      .map(p => p.dataset.value);
    const uniform = selectedPills.length > 0
      ? selectedPills.join(', ')
      : document.getElementById('uniformOther').value.trim();

    const lat = parseFloat(document.getElementById('roleLat').value) || null;
    const lng = parseFloat(document.getElementById('roleLng').value) || null;

    const payload = {
      name,
      genre:      genre || null,
      level:      document.getElementById('roleLevel').value || null,
      addr:       document.getElementById('roleAddr').value.trim() || null,
      city:       document.getElementById('roleCity').value.trim() || null,
      location:   document.getElementById('roleLocation').value || null,
      uniform:    uniform || null,
      lat,
      lng,
      created_by: window.currentUser.sub,
    };

    btn.disabled = true;
    btn.textContent = 'Publishing…';

      try {
        const token = await auth0Client.getTokenSilently();
        console.log('TOKEN:', token);
        console.log('PARTS:', token.split('.').length);

      const res = await fetch('https://golijzcjitljymhpjaur.supabase.co/rest/v1/roles', {
        method: 'POST',
        headers: {
          'apikey':        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvbGlqemNqaXRsanltaHBqYXVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDYxMDQsImV4cCI6MjA5NTEyMjEwNH0.fRLEv-8VrrrdnN6Ds9iux4PuDfHcLS3x2ezodp4w_Bk',
          'Authorization': `Bearer ${token}`,
          'Content-Type':  'application/json',
          'Prefer':        'return=representation',
        },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        window.location.href = 'listings.html';
      } else {
        const err = await res.json();
        throw new Error(err.message ?? JSON.stringify(err));
      }
    } catch (e) {
      errEl.textContent = 'Error: ' + e.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Publish Role →';
    }
  }
</script>
</body>
</html>
