<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create a Role – Performr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #ff6558;
      min-height: 100vh;
    }

   
    .field input::placeholder,
    .field textarea::placeholder { color: #bbb; }

    .field textarea { resize: vertical; min-height: 80px; }

    /* custom select wrapper */
    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: .85rem;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #888;
      font-size: .8rem;
    }
    .select-wrap select { width: 100%; padding-right: 2rem; cursor: pointer; }

    /* two-column row */
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }

    /* tag pills for custom multi-select feel */
    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
    }
    .pill {
      padding: .35rem .85rem;
      border-radius: 999px;
      border: 1.5px solid #e4e4e0;
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      background: #fafafa;
      color: #555;
      transition: all .15s;
      user-select: none;
    }
    .pill.selected {
      background: #111;
      border-color: #111;
      color: #fff;
    }

    /* event description textarea */
    .event-description-field {
      display: flex;
      flex-direction: column;
      gap: .4rem;
      margin-top: .25rem;
    }
    .event-description-field label {
      font-size: .85rem;
      font-weight: 600;
      color: #333;
    }
    .event-description-field textarea {
      width: 100%;
      padding: .75rem .9rem;
      border: 1.5px solid #e4e4e0;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      color: #111;
      background: #fafafa;
      resize: vertical;
      min-height: 110px;
      line-height: 1.5;
      transition: border-color .15s, box-shadow .15s;
      outline: none;
    }
    .event-description-field textarea::placeholder {
      color: #bbb;
    }
    .event-description-field textarea:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(0,0,0,.06);
      background: #fff;
    }
    .event-description-field .char-count {
      font-size: .75rem;
      color: #aaa;
      text-align: right;
      margin-top: .15rem;
    }
    .event-description-field .char-count.near-limit {
      color: #e07b00;
    }
    .event-description-field .char-count.at-limit {
      color: #c0392b;
    }

    /* submit area */
    .form-footer {
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    #errorMsg {
      font-size: .85rem;
      color: #c0392b;
      display: none;
    }

    .btn-submit {
      width: 100%;
      padding: .85rem;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: -.01em;
      transition: background .15s, opacity .15s;
    }
    .btn-submit:hover { background: #333; }
    .btn-submit:disabled { opacity: .5; cursor: not-allowed; }
  </style>
</head>
<body class="page-layout">

  <header>
    <img src="assets/performr.png" alt="Performr logo" class="logo" />
    <a href="profile.html"></a>
  </header>

  <nav>
    <a href="explore.html">Explore</a>
    <a href="applied.html">Applied</a>
    <a href="listings.html">My Listings</a>
  </nav>

  <main>
    <div class="page-header">
      <a href="listings.html" class="back">←</a>
      <h1>Create a Role</h1>
    </div>

    <form>
      <section>
        <p>Basics</p>
        <label>
          Role name <span style="color:#FF6558">*</span>
          <input id="roleName" type="text" placeholder="e.g. Lead Tap Dancer" />
        </label>
        <label>
          Genre
          <select id="roleGenre">
            <option value="">Select a genre…</option>
            <option>Jazz</option>
            <option>Hip-Hop</option>
            <option>Ballet</option>
            <option>Contemporary</option>
            <option>Latin</option>
            <option>Tap</option>
            <option>Musical Theatre</option>
            <option>Pop</option>
            <option>R&B</option>
            <option>Folk</option>
            <option>Classical</option>
            <option>Other</option>
          </select>
        </label>
        <label id="genreOtherField" hidden>
          Specify genre
          <input id="genreOther" type="text" placeholder="Enter genre…" />
        </label>
        <label>
          Level
          <select id="roleLevel">
            <option value="">Select a level…</option>
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Advanced</option>
            <option>Professional</option>
            <option>Any Level</option>
          </select>
        </label>
      </section>

    <form>
      <section>
        <p>Location</p>
      <div class="form-section">
        <div class="field">
  <label>Address</label>
  <div>
  <input id="roleAddr" type="text" placeholder="123 Main St" style="width:100%;" />
  <button type="button" id="geocodeBtn" style="
    display: block;
    margin-top: .5rem;
    padding: .65rem .9rem;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s;
  " onmouseenter="this.style.background='#333'" onmouseleave="this.style.background='#111'">
    📍 Geocode
  </button>
</div>
  <p id="geocodeStatus" style="font-size:.75rem; color:#888; margin-top:.3rem;"></p>
</div>
        <div class="field-row">
          <div class="field">
            <label for="roleCity">City</label>
            <input id="roleCity" type="text" placeholder="Montreal" />
          </label>
          <label>
            Location type
            <select id="roleLocation">
              <option value="">Select…</option>
              <option>Indoor Studio</option>
              <option>Outdoor Stage</option>
              <option>Theatre</option>
              <option>Club / Venue</option>
              <option>Street / Public</option>
              <option>Private Event</option>
              <option>Remote / Virtual</option>
              <option>TBD</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label>
            Latitude <small>(geocode)</small>
            <input id="roleLat" type="number" step="any" placeholder="45.5017" />
          </label>
          <label>
            Longitude <small>(geocode)</small>
            <input id="roleLng" type="number" step="any" placeholder="-73.5673" />
          </label>
        </div>
      </section>

      <section>
        <p>Details</p>
        <label>Uniform / Dress code</label>
        <div class="pills" id="uniformPills">
          <span data-value="Black attire">Black attire</span>
          <span data-value="Costume provided">Costume provided</span>
          <span data-value="Bring your own">Bring your own</span>
          <span data-value="Casual">Casual</span>
          <span data-value="Formal">Formal</span>
          <span data-value="None">None</span>
        </div>

        <!-- ── NEW: Event Description ── -->
        <div class="event-description-field" style="margin-top: 1.25rem;">
          <label for="eventDescription">Event description</label>
          <textarea
            id="eventDescription"
            maxlength="600"
            placeholder="Describe the event — what performers can expect, the vibe, any special requirements, compensation details, etc."
          ></textarea>
          <span class="char-count" id="descCharCount">0 / 600</span>
        </div>

      </div>

      <!-- SUBMIT -->
      <div class="form-footer">
        <p id="errorMsg"></p>
        <button class="btn-submit" id="submitBtn" onclick="submitRole()">Publish Role →</button>
      </div>

    </div>
  </div>
  

<script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL      = 'https://golijzcjitljymhpjaur.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvbGlqemNqaXRsanltaHBqYXVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NDYxMDQsImV4cCI6MjA5NTEyMjEwNH0.fRLEv-8VrrrdnN6Ds9iux4PuDfHcLS3x2ezodp4w_Bk';

    let currentUser = null;
    let auth0Client = null;

    (async () => {
      auth0Client = await auth0.createAuth0Client({
        domain: 'dev-wdfb7tfjkndmtcl5.us.auth0.com',
        clientId: 'Ix662hc4PCymFOpQeFK4OvMKWzAjF3Cn',
        authorizationParams: {
          redirect_uri: location.origin,
          audience: 'https://performr.api',
        },
        cacheLocation: 'localstorage',
        useRefreshTokens: true,
      });

      if (!(await auth0Client.isAuthenticated())) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = await auth0Client.getUser();
    })();

    document.getElementById('roleGenre').addEventListener('change', function () {
      document.getElementById('genreOtherField').hidden = this.value !== 'Other';
    });

    // Uniform pill toggle — use .on to match style.css
    document.querySelectorAll('#uniformPills span').forEach(pill => {
      pill.addEventListener('click', () => {
        pill.classList.toggle('on');
        document.getElementById('uniformOther').value = '';
      });
    });

    // Character counter for event description
    const descTextarea = document.getElementById('eventDescription');
    const descCharCount = document.getElementById('descCharCount');
    descTextarea.addEventListener('input', () => {
      const len = descTextarea.value.length;
      const max = parseInt(descTextarea.getAttribute('maxlength'));
      descCharCount.textContent = `${len} / ${max}`;
      descCharCount.className = 'char-count' +
        (len >= max ? ' at-limit' : len >= max * 0.85 ? ' near-limit' : '');
    });

  document.getElementById('geocodeBtn').addEventListener('click', async () => {
  const addr   = document.getElementById('roleAddr').value.trim();
  const city   = document.getElementById('roleCity').value.trim();
  const query  = [addr, city].filter(Boolean).join(', ');
  const status = document.getElementById('geocodeStatus');

  if (!query) {
    status.textContent = 'Enter an address or city first.';
    status.style.color = '#c00';
    return;
  }

  status.textContent = 'Looking up coordinates…';
  status.style.color = '#888';

  try {
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
    const res  = await fetch(url, {
      headers: { 'Accept-Language': 'en' }
    });
    const data = await res.json();

    if (!data.length) {
      status.textContent = '⚠️ Address not found. Try adding a city or country.';
      status.style.color = '#c00';
      return;
    }

    document.getElementById('roleLat').value = parseFloat(data[0].lat).toFixed(6);
    document.getElementById('roleLng').value = parseFloat(data[0].lon).toFixed(6);
    status.textContent = `✓ Found: ${data[0].display_name}`;
    status.style.color = '#2a7a2a';

  } catch (e) {
    status.textContent = '⚠️ Geocoding failed: ' + e.message;
    status.style.color = '#c00';
  }
});

  // ── Submit ──
  async function submitRole() {
    const btn = document.getElementById('submitBtn');
    const errEl = document.getElementById('errorMsg');
    errEl.style.display = 'none';

    const name = document.getElementById('roleName').value.trim();
    if (!name) {
      errEl.textContent = 'Role name is required.';
      errEl.style.display = 'block';
      return;
    }

      const genreSelect = document.getElementById('roleGenre').value;
      const genre = genreSelect === 'Other'
        ? document.getElementById('genreOther').value.trim()
        : genreSelect;

      // Read pills that have .on (matches style.css active state)
      const selectedPills = [...document.querySelectorAll('#uniformPills span.on')].map(p => p.dataset.value);
      const uniform = selectedPills.length
        ? selectedPills.join(', ')
        : document.getElementById('uniformOther').value.trim();

      const lat = parseFloat(document.getElementById('roleLat').value) || null;
      const lng = parseFloat(document.getElementById('roleLng').value) || null;

      const payload = {
        name,
        genre:       genre || null,
        level:       document.getElementById('roleLevel').value || null,
        addr:        document.getElementById('roleAddr').value.trim() || null,
        city:        document.getElementById('roleCity').value.trim() || null,
        location:    document.getElementById('roleLocation').value || null,
        uniform:     uniform || null,
        description: document.getElementById('eventDescription').value.trim() || null,
        lat,
        lng,
        created_by:  currentUser.sub,
      };

      btn.disabled = true;
      btn.textContent = 'Publishing…';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/roles`, {
          method: 'POST',
          headers: {
            'apikey':        SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Content-Type':  'application/json',
            'Prefer':        'return=representation',
          },
          body: JSON.stringify(payload),
        });

      if (res.ok) {
        window.location.href = 'listings.html';
      } else {
        const err = await res.json();
        throw new Error(err.message ?? JSON.stringify(err));
      }
    } catch (e) {
      errEl.textContent = 'Error: ' + e.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Publish Role →';
    }
  }
</script>

</body>
</html>
