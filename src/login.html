<!doctype html>
<meta charset="UTF-8" />
<title>Login</title>
<h1>Login</h1>
<form id="login-form">
  <input type="email " id="email" placeholder="Email or Username" required />
  <input type="password" id="password" placeholder="Password" required />
  <button type="submit">Login</button>
</form>
<p>Don't have an account? <a href="signup.html">Sign Up</a></p>

<script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
<script>
  (async () => {
    const client = await auth0.createAuth0Client({
      domain: 'dev-wdfb7tfjkndmtcl5.us.auth0.com',
      clientId: 'Ix662hc4PCymFOpQeFK4OvMKWzAjF3Cn',
      authorizationParams: { redirect_uri: location.origin },
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const emailOrUsername = document.getElementById('email').value;

      try {
        await client.loginWithRedirect({
          authorizationParams: {
            login_hint: emailOrUsername
          }
        });
      } catch (error) {
        console.error('Login error:', error);
        alert('Login failed: ' + error.message);
      }
    });
  })();
</script>
