<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applied – Performr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-layout">

  <header>
    <img src="assets/performr.png" alt="Performr logo" class="logo" />
    <a href="profile.html"></a>
  </header>

  <nav>
    <a href="explore.html">Explore</a>
    <a href="applied.html">Applied</a>
    <a href="listings.html">My Listings</a>
  </nav>

  <main>
<div class="page-header">
  <h1>Applied Roles</h1>
</div>
    <ul class="roles" id="roles-list">
      <li>Loading…</li>
    </ul>
  </main>

  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.18/auth0-spa-js.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      if (!await initApp()) return;

      const { data, error } = await window.db
        .from('applications')
        .select('*, roles(*)')
        .eq('applicant_id', window.currentUser.sub);

      const list = document.getElementById('roles-list');
      list.innerHTML = '';

      if (error) { list.innerHTML = '<li>Failed to load applications.</li>'; return; }
      if (!data?.length) { list.innerHTML = "<li>You haven't applied to any roles yet.</li>"; return; }

      data.forEach(({ roles: role, status }) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <h2>${role.name}</h2>
          <p>${role.addr ? role.addr + ', ' : ''}${role.city ?? ''}</p>
          <footer>
            ${[role.genre, role.level, role.location, role.uniform].filter(Boolean).map(t => `<span>${t}</span>`).join('')}
          </footer>
          <p class="status">Status: ${status}</p>
        `;
        list.appendChild(li);
      });
    })();
  </script>
</body>
</html>
